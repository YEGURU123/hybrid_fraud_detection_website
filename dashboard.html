<!-- templates/dashboard.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hybrid AI Fraud Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt"></i> Hybrid AI Fraud Detection
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/simulation">Live Simulation</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2><i class="fas fa-chart-line text-primary"></i> Performance Dashboard</h2>
            <button id="initBtn" class="btn btn-primary">
                <i class="fas fa-power-off"></i> Initialize System
            </button>
        </div>

        <!-- Metric Cards -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">Fraud Capture Rate</div>
                    <div class="metric-value text-success" id="fraudCaptureRate">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">False Decline Rate</div>
                    <div class="metric-value text-warning" id="falseDeclineRate">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">Precision</div>
                    <div class="metric-value text-info" id="precision">--</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">F1 Score</div>
                    <div class="metric-value text-primary" id="f1Score">--</div>
                </div>
            </div>
        </div>

        <div class="row g-4">
            <!-- Confusion Matrix -->
            <div class="col-lg-6">
                <div class="panel">
                    <h5><i class="fas fa-table"></i> Confusion Matrix</h5>
                    <canvas id="confusionMatrixChart" height="220"></canvas>
                </div>
            </div>

            <!-- Action Distribution -->
            <div class="col-lg-6">
                <div class="panel">
                    <h5><i class="fas fa-chart-pie"></i> Decision Distribution</h5>
                    <canvas id="actionDistributionChart" height="220"></canvas>
                </div>
            </div>

            <!-- RL Q-Table -->
            <div class="col-lg-12">
                <div class="panel">
                    <h5><i class="fas fa-brain"></i> RL Agent Q-Table</h5>
                    <div class="table-responsive">
                        <table class="table table-dark table-striped table-sm" id="qTableBody">
                            <thead>
                                <tr>
                                    <th>State</th>
                                    <th>Approve</th>
                                    <th>Flag 2FA</th>
                                    <th>Block</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initDashboardPage();
        });
    </script>
</body>
</html>
