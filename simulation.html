<!-- templates/simulation.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Simulation - Hybrid AI Fraud Detection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">
                <i class="fas fa-shield-alt"></i> Hybrid AI Fraud Detection
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/simulation">Live Simulation</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-4">
        <h2 class="mb-4"><i class="fas fa-bolt text-warning"></i> Live Transaction Simulation</h2>

        <!-- Controls -->
        <div class="panel mb-4">
            <div class="row g-3 align-items-end">
                <div class="col-md-3">
                    <label class="form-label text-white-50">Number of Transactions</label>
                    <input type="number" id="nTransactions" class="form-control" value="500" min="10" max="10000">
                </div>
                <div class="col-md-3">
                    <label class="form-label text-white-50">Fraud Rate</label>
                    <input type="number" id="fraudRate" class="form-control" value="0.02" min="0" max="1" step="0.01">
                </div>
                <div class="col-md-2">
                    <button id="startSimBtn" class="btn btn-success w-100">
                        <i class="fas fa-play"></i> Start
                    </button>
                </div>
                <div class="col-md-2">
                    <button id="stopSimBtn" class="btn btn-danger w-100">
                        <i class="fas fa-stop"></i> Stop
                    </button>
                </div>
                <div class="col-md-2">
                    <span id="simStatus" class="badge bg-secondary w-100 py-2">Idle</span>
                </div>
            </div>
        </div>

        <!-- Live counters -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">Processed</div>
                    <div class="metric-value" id="liveProcessed">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">Approved</div>
                    <div class="metric-value text-success" id="liveApproved">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">Flagged (2FA)</div>
                    <div class="metric-value text-warning" id="liveFlagged">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card">
                    <div class="metric-label">Blocked</div>
                    <div class="metric-value text-danger" id="liveBlocked">0</div>
                </div>
            </div>
        </div>

        <!-- Live transaction feed -->
        <div class="panel">
            <h5><i class="fas fa-stream"></i> Transaction Feed</h5>
            <div class="table-responsive" style="max-height: 480px; overflow-y: auto;">
                <table class="table table-dark table-hover table-sm mb-0">
                    <thead class="sticky-top">
                        <tr>
                            <th>Transaction ID</th>
                            <th>Amount</th>
                            <th>Risk Level</th>
                            <th>Risk Score</th>
                            <th>Decision</th>
                            <th>Actual</th>
                        </tr>
                    </thead>
                    <tbody id="liveFeedBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            initSimulationPage();
        });
    </script>
</body>
</html>
